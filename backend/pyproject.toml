[project]
name = "studioledger-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.40",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.30",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "BLE", "DTZ"]
extend-ignore = [
    "B008",   # Depends() in FastAPI defaults is the idiomatic FastAPI pattern
    "BLE001", # FallbackClient intentionally catches broadly to keep the app resilient
    "DTZ011", # Local calendar dates are intentional for a single-user finance demo
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ011"]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.7",
]
